<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="aklaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2461B"/>
      <stop offset="100%" stop-color="#8F2C0B"/>
    </linearGradient>
    <linearGradient id="potGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF2E8"/>
      <stop offset="100%" stop-color="#FEDAC4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3A170A" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="115" fill="url(#aklaBg)"/>

  <!-- Subtle glow -->
  <circle cx="256" cy="256" r="180" fill="#FEDAC4" opacity="0.12"/>

  <!-- Egyptian Cooking Pot / Tagine illustration -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Steam waves -->
    <path d="M210 135 C200 110, 220 95, 210 75" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M256 125 C246 100, 266 85, 256 65" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.9"/>
    <path d="M302 135 C292 110, 312 95, 302 75" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.75"/>

    <!-- Pot Lid Knob -->
    <ellipse cx="256" cy="155" rx="20" ry="12" fill="#FEDAC4"/>
    <rect x="250" y="162" width="12" height="12" fill="#FEDAC4"/>

    <!-- Pot Lid -->
    <path d="M140 215 C150 170, 362 170, 372 215 Z" fill="url(#potGrad)"/>

    <!-- Pot Handles -->
    <rect x="85" y="240" width="30" height="42" rx="10" fill="#FEDAC4"/>
    <rect x="397" y="240" width="30" height="42" rx="10" fill="#FEDAC4"/>

    <!-- Pot Body -->
    <path d="M110 220 L402 220 L378 350 C370 380, 350 400, 310 400 L202 400 C162 400, 142 380, 134 350 Z" fill="#FFFFFF"/>

    <!-- Pot Accent Stripe -->
    <path d="M126 270 L386 270 L381 295 L131 295 Z" fill="#FCEBE2"/>

    <!-- Arabic Wordmark / Smile -->
    <path d="M200 330 Q256 370 312 330" stroke="#C2461B" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>
</svg>

