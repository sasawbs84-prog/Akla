<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اختيار الأكل 5 — تفاصيل البيت</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../akla.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="screen">
  <div class="safe-top"></div>
  <div class="appbar">
    <a class="icon-btn ghost" href="Prefs-4-Flavors.dc.html" aria-label="رجوع"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <p class="t-small c-2" style="flex: 1; text-align: center">الخطوة 5 من 5</p>
    <span style="width: 48px"></span>
  </div>
  <div class="pad" style="padding-bottom: 8px"><div class="progress" role="progressbar" aria-valuenow="5" aria-valuemin="0" aria-valuemax="5" aria-label="التقدم"><i style="width: 100%"></i></div></div>
  <div class="scroll pad" style="padding-top: 12px; padding-bottom: 24px; display: flex; flex-direction: column; gap: 24px">
    <div>
      <h1 class="t-h1">تفاصيل البيت</h1>
      <p class="t-body c-2" style="margin-top: 4px">عشان المقادير تيجي على قدّكم بالظبط.</p>
    </div>

    <div class="card" style="padding: 16px; display: flex; align-items: center; gap: 12px">
      <span class="lead" style="width: 48px; height: 48px; border-radius: 14px; background: var(--c-primary-tint); color: var(--c-primary-press); display: grid; place-items: center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg></span>
      <div style="flex: 1"><p class="t-h3">عدد أفراد الأسرة</p><p class="t-cap c-3">بما فيهم الأطفال</p></div>
      <div class="stepper">
        <button onClick="{{inc}}" aria-label="زوّد فرد"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <output aria-live="polite" style="min-width: 40px">{{people}}</output>
        <button onClick="{{dec}}" aria-label="قلّل فرد"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      </div>
    </div>

    <div>
      <h2 class="t-h3" style="margin-bottom: 10px">وقت الطبخ المتاح في اليوم</h2>
      <div role="radiogroup" aria-label="وقت الطبخ" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{times}}" as="t" hint-placeholder-count="4">
          <button role="radio" aria-checked="{{t.on}}" class="{{t.cls}}" onClick="{{t.pick}}" style="justify-content: center; height: 52px; border-radius: 14px">{{t.label}}</button>
        </sc-for>
      </div>
    </div>

    <div>
      <h2 class="t-h3">حاجات مش بتحبوها أو حساسية</h2>
      <p class="t-cap c-3" style="margin-bottom: 10px">مش هنقترح أي أكلة فيها الحاجات دي.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px">
        <sc-for list="{{avoid}}" as="a" hint-placeholder-count="6">
          <button class="{{a.cls}}" aria-pressed="{{a.on}}" onClick="{{a.toggle}}">{{a.label}}</button>
        </sc-for>
      </div>
      <div class="field">
        <label for="notes">ملاحظات تانية</label>
        <textarea id="notes" class="input" placeholder="مثلاً: جوزي مش بياكل بصل، الأولاد مش بيحبوا الباذنجان…"></textarea>
      </div>
    </div>
  </div>
  <div class="sticky-cta">
    <a class="btn btn-primary btn-block" href="Prefs-Summary.dc.html">شوفي الملخص
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var TIMES = ['أقل من 30 دقيقة', 'حوالي ساعة', 'ساعة ونص أو أكتر', 'مش فارقة'];
var AVOID = ['مكسرات', 'لبن ومنتجاته', 'جلوتين (قمح)', 'بيض', 'سمك وجمبري', 'بصل'];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { people: 4, time: 1, avoid: { 0: 1 } };
  }
  renderVals() {
    var self = this, st = this.state;
    return {
      people: st.people,
      inc: function () { self.setState({ people: Math.min(12, self.state.people + 1) }); },
      dec: function () { self.setState({ people: Math.max(1, self.state.people - 1) }); },
      times: TIMES.map(function (label, i) {
        var on = st.time === i;
        return { label: label, on: on, cls: on ? 'chip is-on' : 'chip', pick: function () { self.setState({ time: i }); } };
      }),
      avoid: AVOID.map(function (label, i) {
        var on = !!st.avoid[i];
        return { label: label, on: on, cls: on ? 'chip is-on' : 'chip', toggle: function () {
          var s = Object.assign({}, self.state.avoid); if (s[i]) delete s[i]; else s[i] = 1; self.setState({ avoid: s }); } };
      })
    };
  }
}
</script>
</body>
</html>
