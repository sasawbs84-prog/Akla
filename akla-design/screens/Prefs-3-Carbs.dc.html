<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اختيار الأكل 3 — النشويات</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../akla.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="screen">
  <div class="safe-top"></div>
  <div class="appbar">
    <a class="icon-btn ghost" href="Prefs-2-Vegetables.dc.html" aria-label="رجوع"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <p class="t-small c-2" style="flex: 1; text-align: center">الخطوة 3 من 5</p>
    <a class="btn btn-ghost" href="Prefs-4-Flavors.dc.html">تخطّي</a>
  </div>
  <div class="pad" style="padding-bottom: 8px"><div class="progress" role="progressbar" aria-valuenow="3" aria-valuemin="0" aria-valuemax="5" aria-label="التقدم"><i style="width: 60%"></i></div></div>
  <div class="scroll pad" style="padding-top: 12px; padding-bottom: 24px">
    <h1 class="t-h1">النشويات</h1>
    <p class="t-body c-2" style="margin-top: 4px">إيه اللي بيتقدّم جنب الأكل عندكم؟</p>

    <div class="sec-head"><h2 class="t-h3">أرز ومكرونة</h2><button class="btn btn-ghost" onClick="{{rice.all}}">{{rice.allLabel}}</button></div>
    <div class="pick-grid">
      <sc-for list="{{rice.items}}" as="it" hint-placeholder-count="6">
        <button class="{{it.cls}}" aria-pressed="{{it.on}}" onClick="{{it.toggle}}">
          <span class="badge" aria-hidden="true"><svg class="i sm" viewBox="0 0 24 24" style="stroke-width: 3"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
          <span class="ph-dot ph-3" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-2 1-3M12 7c0-1.5 1-2 1-3M16 7c0-1.5 1-2 1-3"/></svg></span>
          <span class="lbl">{{it.label}}</span>
        </button>
      </sc-for>
    </div>

    <div class="sec-head"><h2 class="t-h3">بطاطس وعجين ومخبوزات</h2><button class="btn btn-ghost" onClick="{{bread.all}}">{{bread.allLabel}}</button></div>
    <div class="pick-grid">
      <sc-for list="{{bread.items}}" as="it" hint-placeholder-count="6">
        <button class="{{it.cls}}" aria-pressed="{{it.on}}" onClick="{{it.toggle}}">
          <span class="badge" aria-hidden="true"><svg class="i sm" viewBox="0 0 24 24" style="stroke-width: 3"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
          <span class="ph-dot ph-6" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M5 10a4 4 0 0 1 2-7h10a4 4 0 0 1 2 7v9a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/></svg></span>
          <span class="lbl">{{it.label}}</span>
        </button>
      </sc-for>
    </div>
  </div>
  <div class="sticky-cta">
    <a class="btn btn-primary btn-block" href="Prefs-4-Flavors.dc.html">{{cta}}
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var GROUPS = {
  rice: [['white','أرز أبيض'],['vermicelli','أرز بالشعرية'],['moammar','أرز معمر'],['pasta','مكرونة'],['bechamel','مكرونة بشاميل'],['koshari','كشري']],
  bread: [['potato','بطاطس'],['baladi','عيش بلدي'],['feteer','فطير مشلتت'],['roqaq','رقاق'],['sambousek','سمبوسك'],['fattah','فتة']]
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: { white: 1, vermicelli: 1, pasta: 1, bechamel: 1, potato: 1, baladi: 1, fattah: 1 } };
  }
  toggle(id) {
    var s = Object.assign({}, this.state.sel);
    if (s[id]) delete s[id]; else s[id] = 1;
    this.setState({ sel: s });
  }
  group(key) {
    var self = this, sel = this.state.sel;
    var ids = GROUPS[key].map(function (x) { return x[0]; });
    var all = ids.every(function (i) { return sel[i]; });
    return {
      items: GROUPS[key].map(function (x) {
        var on = !!sel[x[0]];
        return { label: x[1], on: on, cls: on ? 'pick is-on' : 'pick', toggle: function () { self.toggle(x[0]); } };
      }),
      allLabel: all ? 'شيلي الكل' : 'اختاري الكل',
      all: function () {
        var s = Object.assign({}, self.state.sel);
        ids.forEach(function (i) { if (all) delete s[i]; else s[i] = 1; });
        self.setState({ sel: s });
      }
    };
  }
  renderVals() {
    var n = Object.keys(this.state.sel).length;
    return { rice: this.group('rice'), bread: this.group('bread'), cta: n ? 'التالي · ' + n + ' مختارين' : 'التالي' };
  }
}
</script>
</body>
</html>
