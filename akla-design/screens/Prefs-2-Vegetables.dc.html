<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اختيار الأكل 2 — خضار وبقوليات</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../akla.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="screen">
  <div class="safe-top"></div>
  <div class="appbar">
    <a class="icon-btn ghost" href="Prefs-1-Proteins.dc.html" aria-label="رجوع"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <p class="t-small c-2" style="flex: 1; text-align: center">الخطوة 2 من 5</p>
    <a class="btn btn-ghost" href="Prefs-3-Carbs.dc.html">تخطّي</a>
  </div>
  <div class="pad" style="padding-bottom: 8px"><div class="progress" role="progressbar" aria-valuenow="2" aria-valuemin="0" aria-valuemax="5" aria-label="التقدم"><i style="width: 40%"></i></div></div>
  <div class="scroll pad" style="padding-top: 12px; padding-bottom: 24px">
    <h1 class="t-h1">خضار وبقوليات</h1>
    <p class="t-body c-2" style="margin-top: 4px">إيه الخضار اللي بتطبخيها؟ اختاري براحتك.</p>

    <div class="sec-head"><h2 class="t-h3">خضروات</h2><button class="btn btn-ghost" onClick="{{veg.all}}">{{veg.allLabel}}</button></div>
    <div class="pick-grid">
      <sc-for list="{{veg.items}}" as="it" hint-placeholder-count="12">
        <button class="{{it.cls}}" aria-pressed="{{it.on}}" onClick="{{it.toggle}}">
          <span class="badge" aria-hidden="true"><svg class="i sm" viewBox="0 0 24 24" style="stroke-width: 3"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
          <span class="ph-dot ph-2" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M5 19c0-8 5-14 15-15-1 10-7 15-15 15z"/><path d="M5 19 13 11"/></svg></span>
          <span class="lbl">{{it.label}}</span>
        </button>
      </sc-for>
    </div>

    <div class="sec-head"><h2 class="t-h3">بقوليات</h2><button class="btn btn-ghost" onClick="{{leg.all}}">{{leg.allLabel}}</button></div>
    <div class="pick-grid">
      <sc-for list="{{leg.items}}" as="it" hint-placeholder-count="5">
        <button class="{{it.cls}}" aria-pressed="{{it.on}}" onClick="{{it.toggle}}">
          <span class="badge" aria-hidden="true"><svg class="i sm" viewBox="0 0 24 24" style="stroke-width: 3"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
          <span class="ph-dot ph-4" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><ellipse cx="9" cy="10" rx="4" ry="5"/><ellipse cx="15.5" cy="14" rx="4" ry="5"/></svg></span>
          <span class="lbl">{{it.label}}</span>
        </button>
      </sc-for>
    </div>
  </div>
  <div class="sticky-cta">
    <a class="btn btn-primary btn-block" href="Prefs-3-Carbs.dc.html">{{cta}}
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var GROUPS = {
  veg: [['zucchini','كوسة'],['okra','بامية'],['eggplant','باذنجان'],['molokhia','ملوخية'],['spinach','سبانخ'],['cabbage','كرنب'],['vine','ورق عنب'],['greenbeans','فاصوليا خضرا'],['peas','بسلة'],['cauliflower','قرنبيط'],['pepper','فلفل رومي'],['carrot','جزر']],
  leg: [['fava','فول'],['lentils','عدس'],['whitebeans','فاصوليا بيضا'],['chickpeas','حمص'],['blackeyed','لوبيا']]
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: { zucchini: 1, okra: 1, molokhia: 1, cabbage: 1, vine: 1, peas: 1, eggplant: 1, fava: 1, lentils: 1 } };
  }
  toggle(id) {
    var s = Object.assign({}, this.state.sel);
    if (s[id]) delete s[id]; else s[id] = 1;
    this.setState({ sel: s });
  }
  group(key) {
    var self = this, sel = this.state.sel;
    var ids = GROUPS[key].map(function (x) { return x[0]; });
    var all = ids.every(function (i) { return sel[i]; });
    return {
      items: GROUPS[key].map(function (x) {
        var on = !!sel[x[0]];
        return { label: x[1], on: on, cls: on ? 'pick is-on' : 'pick', toggle: function () { self.toggle(x[0]); } };
      }),
      allLabel: all ? 'شيلي الكل' : 'اختاري الكل',
      all: function () {
        var s = Object.assign({}, self.state.sel);
        ids.forEach(function (i) { if (all) delete s[i]; else s[i] = 1; });
        self.setState({ sel: s });
      }
    };
  }
  renderVals() {
    var n = Object.keys(this.state.sel).length;
    return { veg: this.group('veg'), leg: this.group('leg'), cta: n ? 'التالي · ' + n + ' مختارين' : 'التالي' };
  }
}
</script>
</body>
</html>
