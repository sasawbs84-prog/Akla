<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الإشعارات والرسائل السريعة</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../akla.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="screen" style="background: #3B2A20">
  <div style="padding: 72px 16px 0; color: #fff; text-align: center">
    <p style="margin: 0; font-size: 64px; line-height: 72px; font-weight: 700; font-variant-numeric: tabular-nums">11:00</p>
    <p style="margin: 0; font-size: 16px; font-weight: 600; opacity: .85">الإتنين 2 نوفمبر</p>
  </div>
  <div style="padding: 32px 12px 0">
    <a href="Home.dc.html" style="display: flex; gap: 12px; padding: 14px; border-radius: 22px; background: rgba(255,250,245,.94); box-shadow: var(--sh-2); color: var(--c-text)">
      <img src="../assets/logo-mark.png" alt="" style="width: 44px; height: 44px; border-radius: 11px; background: #fff; object-fit: cover; flex: none">
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; justify-content: space-between"><span class="t-cap c-3">أكلة</span><span class="t-cap c-3">دلوقتي</span></div>
        <p style="margin: 0; font-size: 16px; font-weight: 800; line-height: 24px">أكلة النهاردة: ملوخية بالفراخ</p>
        <p style="margin: 0; font-size: 14px; line-height: 22px; color: var(--c-text-2)">90 دقيقة وتكون على السفرة. دوسي وشوفي المقادير.</p>
      </div>
    </a>
  </div>
  <div style="flex: 1"></div>
  <section style="background: var(--c-bg); border-radius: 28px 28px 0 0; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 12px">
    <p class="t-small c-3">رسائل سريعة داخل التطبيق</p>
    <div class="toast" role="status">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: var(--c-green); display: grid; place-items: center; flex: none"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
      <span>اتضافت 6 حاجات للمشتريات</span>
      <button class="act" style="background: none; border: 0; font: inherit; font-weight: 800; color: #F7B497; min-height: 44px; cursor: pointer">تراجع</button>
    </div>
    <div class="toast" role="status">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: var(--c-primary); display: grid; place-items: center; flex: none"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true" style="fill: #fff; stroke: none"><path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/></svg></span>
      <span>اتحفظت في المفضلة</span>
    </div>
    <div class="toast" role="alert" style="background: #fff; color: var(--c-text); border: 1.5px solid #E7B4AE">
      <span style="width: 28px; height: 28px; border-radius: 50%; background: var(--c-danger); color: #fff; display: grid; place-items: center; flex: none; font-weight: 800">!</span>
      <span style="flex: 1">مقدرناش نغيّر الأكلة دلوقتي</span>
      <button class="act" style="background: none; border: 0; font: inherit; font-weight: 800; color: var(--c-danger); min-height: 44px; cursor: pointer">جربي تاني</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
