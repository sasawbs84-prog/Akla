<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>قائمة المشتريات</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../akla.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="screen">
  <div class="safe-top"></div>
  <header class="appbar">
    <div style="flex: 1"><h1 class="t-h1">المشتريات</h1><p class="t-small c-3">فاضل {{left}} من {{total}} حاجة</p></div>
    <button class="icon-btn" onClick="{{clearDone}}" aria-label="امسحي اللي اتشترى"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg></button>
  </header>
  <div class="pad" style="display: flex; gap: 8px; padding-bottom: 8px">
    <label class="search" style="flex: 1; border-radius: 16px">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <input type="text" placeholder="ضيفي حاجة… مثلاً: كيس عيش" aria-label="ضيفي حاجة للقائمة" value="{{draft}}" onChange="{{onDraft}}">
    </label>
    <button class="btn btn-tonal" onClick="{{add}}" style="height: 52px; padding: 0 18px">ضيفي</button>
  </div>
  <main class="scroll pad" style="padding-bottom: 16px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <section style="margin-top: 12px">
        <h2 class="t-small c-2" style="display: flex; align-items: center; gap: 8px; margin-bottom: 4px"><span class="{{g.dot}}" style="width: 10px; height: 10px; border-radius: 50%"></span>{{g.title}}<span class="c-3" style="font-weight: 600">({{g.count}})</span></h2>
        <div class="card" style="padding: 0 16px">
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <label class="{{it.cls}}">
              <input type="checkbox" class="cb" checked="{{it.done}}" onChange="{{it.toggle}}">
              <span class="name">{{it.name}}</span>
              <span class="qty">{{it.qty}}</span>
            </label>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </main>
  <div style="padding: 10px 16px; border-top: 1px solid var(--c-border); background: var(--c-bg)">
    <button class="btn btn-primary btn-block">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/></svg>
      ابعتي القائمة على واتساب</button>
  </div>
  <nav class="tabbar" aria-label="التنقل الرئيسي">
    <a href="Home.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></span>الرئيسية</a>
    <a href="Explore.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>استكشفي</a>
    <a href="Weekly-Plan.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>الأسبوع</a>
    <a class="on" href="Shopping-List.dc.html" aria-current="page"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1.2 11.1a2 2 0 0 1-2 1.9H8.2a2 2 0 0 1-2-1.9z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>المشتريات</a>
    <a href="Favorites.dc.html"><span class="pill"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/></svg></span>المفضلة</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var START = [
  { title: 'خضار', dot: 'ph-2', items: [['ملوخية خضرا', '500 جرام'], ['بامية صغيرة', '1 كيلو'], ['طماطم', '2 كيلو', 1], ['بصل', '1 كيلو'], ['ثوم بلدي', '2 راس']] },
  { title: 'لحوم وفراخ', dot: 'ph-1', items: [['فرخة متقطعة', '1¼ كيلو'], ['لحمة بقري موزة', '1 كيلو'], ['لحمة مفرومة', '½ كيلو', 1]] },
  { title: 'بقالة', dot: 'ph-3', items: [['أرز مصري', '2 كيلو'], ['سمنة بلدي', '1 علبة', 1], ['صلصة طماطم', '2 علبة']] },
  { title: 'توابل', dot: 'ph-4', items: [['كزبرة ناشفة', '1 كيس'], ['حبهان', '1 كيس']] }
];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      groups: START.map(function (g) { return { title: g.title, dot: g.dot, items: g.items.map(function (x) { return { name: x[0], qty: x[1], done: !!x[2] }; }) }; })
    };
  }
  update(fn) { var g = JSON.parse(JSON.stringify(this.state.groups)); fn(g); this.setState({ groups: g }); }
  renderVals() {
    var self = this, total = 0, left = 0;
    var groups = this.state.groups.map(function (g, gi) {
      return {
        title: g.title, dot: g.dot, count: g.items.length,
        items: g.items.map(function (it, ii) {
          total++; if (!it.done) left++;
          return { name: it.name, qty: it.qty, done: it.done, cls: it.done ? 'check-row is-done' : 'check-row',
            toggle: function () { self.update(function (G) { G[gi].items[ii].done = !G[gi].items[ii].done; }); } };
        })
      };
    }).filter(function (g) { return g.count > 0; });
    return {
      groups: groups, total: total, left: left, draft: this.state.draft,
      onDraft: function (e) { self.setState({ draft: e.target.value }); },
      add: function () {
        var v = self.state.draft.trim(); if (!v) return;
        self.update(function (G) { G[2].items.unshift({ name: v, qty: '', done: false }); });
        self.setState({ draft: '' });
      },
      clearDone: function () { self.update(function (G) { G.forEach(function (g) { g.items = g.items.filter(function (i) { return !i.done; }); }); }); }
    };
  }
}
</script>
</body>
</html>
