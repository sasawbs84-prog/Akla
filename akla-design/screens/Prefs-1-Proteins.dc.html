<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اختيار الأكل 1 — البروتين</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../akla.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="screen">
  <div class="safe-top"></div>
  <div class="appbar">
    <a class="icon-btn ghost" href="Login.dc.html" aria-label="رجوع"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <p class="t-small c-2" style="flex: 1; text-align: center">الخطوة 1 من 5</p>
    <a class="btn btn-ghost" href="Prefs-2-Vegetables.dc.html">تخطّي</a>
  </div>
  <div class="pad" style="padding-bottom: 8px"><div class="progress" role="progressbar" aria-valuenow="1" aria-valuemin="0" aria-valuemax="5" aria-label="التقدم"><i style="width: 20%"></i></div></div>
  <div class="scroll pad" style="padding-top: 12px; padding-bottom: 24px">
    <h1 class="t-h1">بتحبي إيه من البروتين؟</h1>
    <p class="t-body c-2" style="margin-top: 4px">اختاري كل اللي بيتطبخ في بيتك. تقدري تغيّري ده بعدين.</p>

    <div class="sec-head"><h2 class="t-h3">لحوم</h2><button class="btn btn-ghost" onClick="{{meat.all}}">{{meat.allLabel}}</button></div>
    <div class="pick-grid">
      <sc-for list="{{meat.items}}" as="it" hint-placeholder-count="5">
        <button class="{{it.cls}}" aria-pressed="{{it.on}}" onClick="{{it.toggle}}">
          <span class="badge" aria-hidden="true"><svg class="i sm" viewBox="0 0 24 24" style="stroke-width: 3"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
          <span class="ph-dot ph-1" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M7 17c-3-3-2-9 3-11s10 1 10 6-5 7-9 7c-1.5 0-2.8-.6-4-2z"/><circle cx="14" cy="11" r="2"/></svg></span>
          <span class="lbl">{{it.label}}</span>
        </button>
      </sc-for>
    </div>

    <div class="sec-head"><h2 class="t-h3">دواجن</h2><button class="btn btn-ghost" onClick="{{poultry.all}}">{{poultry.allLabel}}</button></div>
    <div class="pick-grid">
      <sc-for list="{{poultry.items}}" as="it" hint-placeholder-count="3">
        <button class="{{it.cls}}" aria-pressed="{{it.on}}" onClick="{{it.toggle}}">
          <span class="badge" aria-hidden="true"><svg class="i sm" viewBox="0 0 24 24" style="stroke-width: 3"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
          <span class="ph-dot ph-3" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M15 4a5 5 0 0 1 3.5 8.5c-1.4 1.4-3.3 1.8-5 1.2L9 18.2a2 2 0 1 1-2.6 2.4 2 2 0 1 1-1.8-3L9 13.1c-.6-1.7-.2-3.6 1.2-5A5 5 0 0 1 15 4z"/></svg></span>
          <span class="lbl">{{it.label}}</span>
        </button>
      </sc-for>
    </div>

    <div class="sec-head"><h2 class="t-h3">أسماك وجمبري</h2><button class="btn btn-ghost" onClick="{{fish.all}}">{{fish.allLabel}}</button></div>
    <div class="pick-grid">
      <sc-for list="{{fish.items}}" as="it" hint-placeholder-count="3">
        <button class="{{it.cls}}" aria-pressed="{{it.on}}" onClick="{{it.toggle}}">
          <span class="badge" aria-hidden="true"><svg class="i sm" viewBox="0 0 24 24" style="stroke-width: 3"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
          <span class="ph-dot ph-5" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M3 12c3-5 9-6 13-3l5-3v12l-5-3c-4 3-10 2-13-3z"/><circle cx="8" cy="11" r="1"/></svg></span>
          <span class="lbl">{{it.label}}</span>
        </button>
      </sc-for>
    </div>

    <div class="sec-head"><h2 class="t-h3">بيض</h2></div>
    <div class="pick-grid">
      <sc-for list="{{egg.items}}" as="it" hint-placeholder-count="1">
        <button class="{{it.cls}}" aria-pressed="{{it.on}}" onClick="{{it.toggle}}">
          <span class="badge" aria-hidden="true"><svg class="i sm" viewBox="0 0 24 24" style="stroke-width: 3"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>
          <span class="ph-dot ph-3" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M12 3c-3.5 0-6 5.5-6 10a6 6 0 0 0 12 0c0-4.5-2.5-10-6-10z"/></svg></span>
          <span class="lbl">{{it.label}}</span>
        </button>
      </sc-for>
    </div>
  </div>
  <div class="sticky-cta">
    <a class="btn btn-primary btn-block" href="Prefs-2-Vegetables.dc.html">{{cta}}
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var GROUPS = {
  meat: [['beef','لحمة بقري'],['lamb','لحمة ضاني'],['kofta','كفتة'],['minced','لحمة مفرومة'],['liver','كبدة']],
  poultry: [['chicken','فراخ'],['duck','بط'],['pigeon','حمام']],
  fish: [['tilapia','سمك بلطي'],['mullet','سمك بوري'],['shrimp','جمبري']],
  egg: [['egg','بيض']]
};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: { beef: 1, kofta: 1, minced: 1, chicken: 1, pigeon: 1, tilapia: 1, egg: 1 } };
  }
  toggle(id) {
    var s = Object.assign({}, this.state.sel);
    if (s[id]) delete s[id]; else s[id] = 1;
    this.setState({ sel: s });
  }
  group(key) {
    var self = this, sel = this.state.sel;
    var ids = GROUPS[key].map(function (x) { return x[0]; });
    var all = ids.every(function (i) { return sel[i]; });
    return {
      items: GROUPS[key].map(function (x) {
        var on = !!sel[x[0]];
        return { label: x[1], on: on, cls: on ? 'pick is-on' : 'pick', toggle: function () { self.toggle(x[0]); } };
      }),
      allLabel: all ? 'شيلي الكل' : 'اختاري الكل',
      all: function () {
        var s = Object.assign({}, self.state.sel);
        ids.forEach(function (i) { if (all) delete s[i]; else s[i] = 1; });
        self.setState({ sel: s });
      }
    };
  }
  renderVals() {
    var n = Object.keys(this.state.sel).length;
    return {
      meat: this.group('meat'), poultry: this.group('poultry'), fish: this.group('fish'), egg: this.group('egg'),
      cta: n ? 'التالي · ' + n + ' مختارين' : 'التالي'
    };
  }
}
</script>
</body>
</html>
