<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>حسابي والتفضيلات</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../akla.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="screen">
  <div class="safe-top"></div>
  <header class="appbar">
    <a class="icon-btn ghost" href="Home.dc.html" aria-label="رجوع"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <h1 class="title">حسابي</h1>
  </header>
  <main class="scroll pad" style="padding-bottom: 32px; display: flex; flex-direction: column; gap: 8px">
    <div class="card" style="padding: 16px; display: flex; align-items: center; gap: 14px">
      <span style="width: 64px; height: 64px; border-radius: 50%; background: var(--c-saffron-tint); color: var(--c-primary-press); display: grid; place-items: center; font-weight: 800; font-size: 26px" aria-hidden="true">م</span>
      <div style="flex: 1; min-width: 0"><p class="t-h3">منى أحمد</p><p class="t-small c-3" dir="ltr" style="text-align: right">+20 101 234 5678</p></div>
      <button class="btn btn-ghost" style="height: 44px">تعديل</button>
    </div>

    <h2 class="t-small c-3" style="margin: 16px 4px 0">تفضيلاتي</h2>
    <div class="list-card">
      <a class="list-item" href="Prefs-Summary.dc.html"><span class="lead" style="background: var(--c-primary-tint); color: var(--c-primary-press)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"/></svg></span><span class="grow">الأكل اللي بحبه</span><span class="val">23 اختيار</span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
      <a class="list-item" href="Prefs-5-Household.dc.html"><span class="lead"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg></span><span class="grow">عدد أفراد الأسرة</span><span class="val">4 أفراد</span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
      <a class="list-item" href="Prefs-5-Household.dc.html"><span class="lead"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg></span><span class="grow">حاجات مش بنحبها وحساسية</span><span class="val">مكسرات</span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
    </div>

    <h2 class="t-small c-3" style="margin: 16px 4px 0">التنبيهات</h2>
    <div class="list-card">
      <label class="list-item" style="cursor: pointer"><span class="lead"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg></span><span class="grow">فكّريني بأكلة اليوم</span><input type="checkbox" class="switch" checked="{{remind}}" onChange="{{toggleRemind}}"></label>
      <sc-if value="{{remind}}" hint-placeholder-val="{{true}}">
        <button class="list-item" style="width: 100%; border: 0; background: transparent; font-family: var(--font); color: var(--c-text); text-align: start; cursor: pointer"><span class="lead"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span><span class="grow">الساعة</span><span class="tag tomato" style="height: 36px; font-size: 15px; padding: 0 14px">11:00 الصبح</span></button>
      </sc-if>
    </div>

    <h2 class="t-small c-3" style="margin: 16px 4px 0">التطبيق</h2>
    <div class="list-card">
      <button class="list-item" style="width: 100%; border-inline: 0; border-top: 0; background: transparent; font-family: var(--font); color: var(--c-text); text-align: start; cursor: pointer"><span class="lead"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></span><span class="grow">اللغة</span><span class="val">العربية</span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="list-item" style="width: 100%; border-inline: 0; border-top: 0; background: transparent; font-family: var(--font); color: var(--c-text); text-align: start; cursor: pointer"><span class="lead"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="grow">المظهر</span><span class="val">فاتح</span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
      <button class="list-item" style="width: 100%; border: 0; background: transparent; font-family: var(--font); color: var(--c-text); text-align: start; cursor: pointer"><span class="lead"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></span><span class="grow">عن أكلة</span><span class="val">إصدار 1.0</span><svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button>
    </div>

    <a class="btn btn-ghost btn-block" href="Login.dc.html" style="height: 56px; margin-top: 12px; color: var(--c-danger)">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M14 8l-4 4 4 4M10 12h10"/></svg>
      تسجيل الخروج</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { remind: true }; }
  renderVals() {
    var self = this;
    return { remind: this.state.remind, toggleRemind: function () { self.setState({ remind: !self.state.remind }); } };
  }
}
</script>
</body>
</html>
