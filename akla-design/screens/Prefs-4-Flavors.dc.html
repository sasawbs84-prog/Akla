<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>اختيار الأكل 4 — الطعم والتوابل</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../akla.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="screen">
  <div class="safe-top"></div>
  <div class="appbar">
    <a class="icon-btn ghost" href="Prefs-3-Carbs.dc.html" aria-label="رجوع"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    <p class="t-small c-2" style="flex: 1; text-align: center">الخطوة 4 من 5</p>
    <a class="btn btn-ghost" href="Prefs-5-Household.dc.html">تخطّي</a>
  </div>
  <div class="pad" style="padding-bottom: 8px"><div class="progress" role="progressbar" aria-valuenow="4" aria-valuemin="0" aria-valuemax="5" aria-label="التقدم"><i style="width: 80%"></i></div></div>
  <div class="scroll pad" style="padding-top: 12px; padding-bottom: 24px">
    <h1 class="t-h1">الطعم اللي بتحبوه</h1>
    <p class="t-body c-2" style="margin-top: 4px">عشان نظبط لك التتبيلة على مزاجكم.</p>

    <div class="sec-head"><h2 class="t-h3">بتحبوا الأكل الحار؟</h2></div>
    <div role="radiogroup" aria-label="درجة الحرارة" style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{heats}}" as="h" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{h.on}}" class="{{h.cls}}" onClick="{{h.pick}}" style="display: flex; flex-direction: row; align-items: center; gap: 12px; min-height: 64px; padding: 10px 16px; border-radius: 16px; font-family: var(--font); cursor: pointer; text-align: start; width: 100%">
          <span class="{{h.radio}}" aria-hidden="true"></span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700">{{h.label}}</span><span class="t-cap c-3">{{h.hint}}</span></span>
          <span class="tag tomato" aria-hidden="true">{{h.chili}}</span>
        </button>
      </sc-for>
    </div>

    <div class="sec-head"><h2 class="t-h3">توابل وأعشاب بتستخدميها</h2><button class="btn btn-ghost" onClick="{{allSpices}}">{{allLabel}}</button></div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{spices}}" as="s" hint-placeholder-count="12">
        <button class="{{s.cls}}" aria-pressed="{{s.on}}" onClick="{{s.toggle}}">
          <sc-if value="{{s.on}}" hint-placeholder-val="{{true}}"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></sc-if>{{s.label}}</button>
      </sc-for>
    </div>
  </div>
  <div class="sticky-cta">
    <a class="btn btn-primary btn-block" href="Prefs-5-Household.dc.html">التالي
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var HEATS = [['none','مش حار خالص','مناسب للأطفال','0'],['mild','حار شوية','شطة خفيفة في التتبيلة','1'],['hot','حار جامد','للي بيحبوا الشطة','2']];
var SPICES = ['كمون','كزبرة ناشفة','بهارات مشكلة','فلفل أسود','حبهان','ورق لورا','شطة','ثوم','كزبرة خضرا','شبت','بقدونس','نعناع'];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { heat: 'mild', sel: { 0: 1, 1: 1, 2: 1, 3: 1, 5: 1, 7: 1, 8: 1, 10: 1 } };
  }
  renderVals() {
    var self = this, st = this.state;
    var all = SPICES.every(function (_, i) { return st.sel[i]; });
    return {
      heats: HEATS.map(function (h) {
        var on = st.heat === h[0];
        return {
          label: h[1], hint: h[2], on: on,
          chili: h[3] === '0' ? 'من غير شطة' : (h[3] === '1' ? 'شطة ×1' : 'شطة ×2'),
          cls: on ? 'pick is-on' : 'pick',
          radio: on ? 'radio on' : 'radio',
          pick: function () { self.setState({ heat: h[0] }); }
        };
      }),
      spices: SPICES.map(function (label, i) {
        var on = !!st.sel[i];
        return { label: label, on: on, cls: on ? 'chip is-on' : 'chip', toggle: function () {
          var s = Object.assign({}, self.state.sel); if (s[i]) delete s[i]; else s[i] = 1; self.setState({ sel: s }); } };
      }),
      allLabel: all ? 'شيلي الكل' : 'اختاري الكل',
      allSpices: function () {
        var s = {}; if (!all) SPICES.forEach(function (_, i) { s[i] = 1; }); self.setState({ sel: s });
      }
    };
  }
}
</script>
</body>
</html>
